name: friendconnect
description: A private friend communication app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_database: ^10.4.9
  firebase_storage: ^11.5.6
  firebase_messaging: ^14.7.10
  flutter_webrtc: ^0.9.48
  flutter_riverpod: ^2.4.9
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  intl: ^0.19.0
  record: ^5.0.5
  audioplayers: ^5.2.1
  path_provider: ^2.1.2
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
