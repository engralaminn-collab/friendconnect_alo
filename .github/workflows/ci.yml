
name: FriendConnect CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: friendconnect-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Install, Prisma, Lint, Typecheck and Build
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    env:
      NODE_VERSION: "22.23.4"
      NPM_VERSION: "10.9.9"
      NEXT_INSTALLED_VERSION: "16.3.0"
      REACT_INSTALLED_VERSION: "19.2.8"
      SOCKET_IO_INSTALLED_VERSION: "4.8.4"
      PRISMA_INSTALLED_VERSION: "6.19.3"
      # CI runs against a throwaway SQLite database and localhost URLs. Pointing
      # these at the production panel made the workflow depend on a live host
      # that CI must never contact.
      DATABASE_URL: "file:./prisma/ci.db"
      NEXTAUTH_SECRET: "ci-only-not-a-production-secret"
      APP_PORT: "3012"
      PORT: "3012"
      APP_URL: "http://127.0.0.1:3012"
      NEXTAUTH_URL: "http://127.0.0.1:3012"
      APP_ORIGIN: "http://127.0.0.1:3012"
      APP_HEALTHCHECK_URL: "http://127.0.0.1:3012/api/health"
      SOCKET_PORT: "3003"
      TURN_PORT: "3478"
      # A Redis URL is deliberately NOT set: tests/security/redis-failure.test.cjs
      # proves the app degrades safely when Redis is configured but unreachable.
      REDIS_URL: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set deployment-matched npm version
        run: npm install --global npm@${NPM_VERSION}

      - name: Verify runtime and lockfile
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"
          test "$(node -p "require('./package-lock.json').packages['node_modules/next'].version")" = "${NEXT_INSTALLED_VERSION}"
          test "$(node -p "require('./package-lock.json').packages['node_modules/react'].version")" = "${REACT_INSTALLED_VERSION}"
          test "$(node -p "require('./package-lock.json').packages['node_modules/socket.io'].version")" = "${SOCKET_IO_INSTALLED_VERSION}"
          test "$(node -p "require('./package-lock.json').packages['node_modules/prisma'].version")" = "${PRISMA_INSTALLED_VERSION}"
          test -f package.json
          test -f package-lock.json
          test -f prisma/schema.sqlite.prisma
          test -f next.config.ts

      - name: Install locked dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Generate SQLite Prisma Client
        run: npx prisma generate --schema prisma/schema.sqlite.prisma

      - name: Validate Prisma schema
        shell: bash
        # `prisma validate` needs the schema engine binary; it is fetched during
        # `npm ci` above. Both provider variants are checked because either can
        # be the one deployed.
        run: |
          set -euo pipefail
          npx prisma validate --schema prisma/schema.prisma
          npx prisma validate --schema prisma/schema.mysql.prisma
          npx prisma validate --schema prisma/schema.sqlite.prisma

      - name: Validate migration history
        shell: bash
        # Fails if prisma/migrations has a gap, a missing migration.sql, or a
        # migration that does not apply cleanly to an empty database.
        run: |
          set -euo pipefail
          npx prisma migrate diff \
            --from-empty \
            --to-schema-datamodel prisma/schema.mysql.prisma \
            --script > /tmp/expected-mysql.sql
          test -s /tmp/expected-mysql.sql
          echo "PASS: MySQL schema renders to a non-empty DDL script."

      - name: Schema drift validation
        shell: bash
        # The canonical schema is the only editable one; the provider variants,
        # the runtime metadata, the SQLite DDL, the MySQL migration and the
        # runtime's delegate list are all generated from it. This fails if any
        # generated artefact is stale.
        run: npm run schema:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Security regression tests
        run: npm run test:security

      - name: Realtime server syntax check
        run: node --check socket-server.js

      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build

      - name: Verify standalone build output
        shell: bash
        run: |
          set -euo pipefail
          test -f .next/standalone/server.js
          test -d .next/standalone/.next
          echo "PASS: Next.js standalone server and static output exist."

      - name: Integration tests (isolated database per test)
        shell: bash
        # Each test file creates its own temp SQLite database and its own server
        # on a free port; nothing here reads DATABASE_URL.
        run: npm run test:integration

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright end-to-end tests
        shell: bash
        # Runs against the production build produced above, on a throwaway
        # database created by playwright.config.ts. Previously the specs existed
        # but were never executed (finding #13).
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload production build artifact
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: friendconnect-next-standalone-${{ github.sha }}
          path: .next/standalone/
          if-no-files-found: error
          retention-days: 7
