
name: FriendConnect CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: friendconnect-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Install, Prisma, Lint, Typecheck and Build
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    env:
      NODE_VERSION: "22.23.4"
      NPM_VERSION: "10.9.9"
      NEXT_INSTALLED_VERSION: "16.3.0"
      REACT_INSTALLED_VERSION: "19.2.8"
      SOCKET_IO_INSTALLED_VERSION: "4.8.4"
      PRISMA_INSTALLED_VERSION: "6.19.3"
      DATABASE_URL: "file:./prisma/ci.db"
      NEXTAUTH_SECRET: "ci-only-not-a-production-secret"
      APP_PORT: "3012"
      PORT: "3012"
      APP_URL: "https://panel.alolabs.net"
      NEXTAUTH_URL: "https://panel.alolabs.net"
      APP_HEALTHCHECK_URL: "https://panel.alolabs.net/api/health"
      SOCKET_PORT: "3003"
      TURN_PORT: "3478"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set deployment-matched npm version
        run: npm install --global npm@${NPM_VERSION}

      - name: Verify runtime and lockfile
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"
          test "$(node -p "require('./package-lock.json').packages['node_modules/next'].version")" = "${NEXT_INSTALLED_VERSION}"
          test "$(node -p "require('./package-lock.json').packages['node_modules/react'].version")" = "${REACT_INSTALLED_VERSION}"
          test "$(node -p "require('./package-lock.json').packages['node_modules/socket.io'].version")" = "${SOCKET_IO_INSTALLED_VERSION}"
          test "$(node -p "require('./package-lock.json').packages['node_modules/prisma'].version")" = "${PRISMA_INSTALLED_VERSION}"
          test -f package.json
          test -f package-lock.json
          test -f prisma/schema.sqlite.prisma
          test -f next.config.ts

      - name: Install locked dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Generate SQLite Prisma Client
        run: npx prisma generate --schema prisma/schema.sqlite.prisma

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and security regression tests
        run: npm run test:unit

      - name: Realtime server syntax check
        run: node --check socket-server.js

      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build

      - name: Verify standalone build output
        shell: bash
        run: |
          set -euo pipefail
          test -f .next/standalone/server.js
          test -d .next/standalone/.next
          echo "PASS: Next.js standalone server and static output exist."

      - name: End-to-end security regressions
        run: npm run test:integration

      - name: Upload production build artifact
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: friendconnect-next-standalone-${{ github.sha }}
          path: .next/standalone/
          if-no-files-found: error
          retention-days: 7
