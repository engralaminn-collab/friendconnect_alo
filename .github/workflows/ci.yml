# CI/CD for FriendConnect
# FriendConnect CI/CD Pipeline
name: FriendConnect CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install || npm ci --legacy-peer-deps --ignore-scripts
      - name: Generate Prisma Client
        run: bunx prisma generate
        env:
          DATABASE_URL: "file:./prisma/dev.db"
      - name: Lint
        run: bun run lint
      # Typecheck is blocking: the pre-existing errors it used to tolerate were
      # caused by mini-services/chat-service importing a client that is not
      # generated at that point. That path is now excluded from the app's
      # tsconfig (it is a separate service, not part of the Next.js app).
      - name: Typecheck
        run: bun run typecheck
      - name: "Build (non-fatal — missing deps nodemailer/web-push/ioredis)"
        continue-on-error: true
        run: bun run build
        env:
          NEXTAUTH_SECRET: "ci-build-placeholder"
          NEXTAUTH_URL: "http://localhost:3000"
          DATABASE_URL: "file:./prisma/dev.db"
      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: .next/standalone
          if-no-files-found: ignore

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && vars.AUTO_DEPLOY_MAIN == 'true'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.ALO_SERVER_HOST }}
          username: ${{ secrets.ALO_SERVER_USER }}
          key: ${{ secrets.ALO_SERVER_SSH_KEY }}
          port: ${{ vars.ALO_SERVER_SSH_PORT }}
          # Host-key verification stays ON. Set ALO_SERVER_FINGERPRINT to the
          # server's SHA256 host-key fingerprint. Do not "fix" a mismatch by
          # setting this to an empty string.
          fingerprint: ${{ secrets.ALO_SERVER_FINGERPRINT }}
          envs: FRIENDCONNECT_DIR
          script: |
            set -euo pipefail
            cd "$FRIENDCONNECT_DIR"

            # Refuse to deploy over uncommitted local edits on the server —
            # someone may have hot-fixed production and not committed it.
            if [ -n "$(git status --porcelain)" ]; then
              echo "ABORT: working tree on the server is dirty. Commit or stash first."
              git status --short
              exit 1
            fi

            # Back up before touching the database. deploy.sh runs additive
            # migrations; this gives us a restore point if anything goes wrong.
            if [ -x ./scripts/backup.sh ]; then
              echo "==> backup"
              ./scripts/backup.sh
            else
              echo "WARN: scripts/backup.sh missing or not executable"
            fi

            git pull --ff-only origin main
            ./scripts/deploy.sh

            echo "==> post-deploy health"
            if [ -x ./scripts/healthcheck.sh ]; then ./scripts/healthcheck.sh; fi
        env:
          FRIENDCONNECT_DIR: ${{ vars.FRIENDCONNECT_DIR }}
