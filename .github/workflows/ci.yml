
name: FriendConnect CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: friendconnect-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Install, Prisma, Lint, Typecheck and Build
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    env:
      NODE_ENV: production
      APP_PORT: "3012"
      PORT: "3012"
      APP_URL: "https://panel.alolabs.net"
      NEXTAUTH_URL: "https://panel.alolabs.net"
      APP_HEALTHCHECK_URL: "https://panel.alolabs.net/api/health"
      SOCKET_PORT: "3003"
      TURN_PORT: "3478"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify runtime and lockfile
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          test -f package.json
          test -f package-lock.json
          test -f prisma/schema.sqlite.prisma
          test -f next.config.ts

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate SQLite Prisma Client
        run: npx prisma generate --schema prisma/schema.sqlite.prisma

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Verify standalone build output
        shell: bash
        run: |
          set -euo pipefail
          test -f .next/standalone/server.js
          test -d .next/standalone/.next
          echo "PASS: Next.js standalone server and static output exist."

      - name: Upload production build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: friendconnect-next-standalone-${{ github.sha }}
          path: .next/standalone/
          if-no-files-found: error
          retention-days: 7
