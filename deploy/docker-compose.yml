# FriendConnect — self-hosted deployment stack
#
# Reproducible, and internally consistent with the application's *actual*
# supported database providers. Audit findings 4 and 16 rewrote this file:
#
#   * it used to provision `postgres:16-alpine` and set `DATABASE_URL` to a
#     `postgresql://` URL, but there is no PostgreSQL variant of the Prisma
#     schema (`prisma/schema.prisma` is SQLite, `prisma/schema.mysql.prisma` is
#     MySQL). The documented `docker compose up -d` could never work.
#     MySQL 8 is the supported non-SQLite provider, so it is what this stack runs.
#   * it started `mini-services/chat-service` (the legacy realtime server that
#     trusts a token format nothing issues and does not enforce blocks). The
#     authoritative server is `socket-server.js`, which shares its
#     authorization logic with the REST API via `src/lib/socket-security.cjs`.
#   * the app image expected `bun.lock`, which does not exist. This repository is
#     an npm project with a committed `package-lock.json`.
#
# Usage:
#   cd deploy
#   cp .env.example .env      # then edit .env: NEXTAUTH_SECRET, MYSQL_* passwords
#   docker compose up -d --build
#   docker compose run --rm app npx prisma migrate deploy --schema prisma/schema.mysql.prisma
#   # App: http://localhost:3000
#
# SQLite-only evaluation (no MySQL): use the root `docker-compose.yml`, which
# targets the zero-dependency SQLite runtime instead.

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-friendconnect}
      MYSQL_USER: ${MYSQL_USER:-fc}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me_in_production}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_in_production}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # `mysqladmin ping` succeeds before the server accepts user connections, so
      # actually run a query as the application user.
      test: ["CMD-SHELL", "mysql -u${MYSQL_USER:-fc} -p${MYSQL_PASSWORD:-change_me_in_production} -e 'SELECT 1' ${MYSQL_DATABASE:-friendconnect}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - "3306:3306"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI (view caught emails)

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    # For production, set TURN_EXTERNAL_IP to the public address of this host.
    command: >-
      -n --log-file=stdout
      --listening-port=3478
      --min-port=49160
      --max-port=49200
      --realm=${TURN_REALM:-friendconnect.local}
      --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
      --user=${TURN_USER:-fc}:${TURN_PASSWORD:-change_me}
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    volumes:
      - turn_data:/var/lib/coturn

  # Authoritative Socket.IO realtime server. Same image as the app: it imports
  # `src/lib/socket-security.cjs` and `src/lib/db-runtime.js` from the repo root,
  # which is exactly what the image copies.
  socket:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    restart: unless-stopped
    command: ["node", "socket-server.js"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER:-fc}:${MYSQL_PASSWORD:-change_me_in_production}@mysql:3306/${MYSQL_DATABASE:-friendconnect}
      REDIS_URL: redis://redis:6379
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in deploy/.env}
      SOCKET_PORT: 3003
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      APP_INTERNAL_URL: http://app:3000
      UPLOAD_DIR: /data/upload
    volumes:
      - uploads:/data/upload
    ports:
      - "3003:3003"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      socket:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: mysql://${MYSQL_USER:-fc}:${MYSQL_PASSWORD:-change_me_in_production}@mysql:3306/${MYSQL_DATABASE:-friendconnect}
      REDIS_URL: redis://redis:6379
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in deploy/.env}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      SOCKET_INTERNAL_URL: http://socket:3003
      APP_INTERNAL_URL: http://app:3000
      # Served from the shared volume by both the app and the socket server.
      UPLOAD_DIR: /data/upload
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    volumes:
      - uploads:/data/upload
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  mysql_data:
  redis_data:
  turn_data:
  uploads:
